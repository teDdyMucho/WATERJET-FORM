<!-- ============================================================
  Waterjet Contact Form — WordPress embed
  ------------------------------------------------------------
  Paste this whole snippet into a WordPress "Custom HTML" block.

  The form itself lives in index.html, hosted on Netlify. This
  iframe keeps the form's styles and scripts isolated from the
  WordPress theme.

  Replace https://YOUR-SITE.netlify.app/ with the real Netlify URL.
============================================================= -->
<iframe
  id="wj-contact-form-frame"
  src="https://YOUR-SITE.netlify.app/"
  title="Contact form"
  style="width:100%; max-width:860px; height:1100px; border:0; display:block; margin:0 auto;"
  loading="lazy"></iframe>
<script>
// Resizes the iframe to fit the form exactly (the form reports its height).
(function () {
  var frame = document.getElementById("wj-contact-form-frame");
  window.addEventListener("message", function (e) {
    if (e.source !== frame.contentWindow) return;
    var h = e.data && e.data.wjContactFormHeight;
    if (typeof h === "number" && h > 0) frame.style.height = h + "px";
  });
})();
</script>
